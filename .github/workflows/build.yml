name: Build Crunchymirror Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Extension
        run: ./gradlew make makePluginsJson
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crunchymirror-build
          path: |
            Crunchymirror/build/outputs/*.cs3
            plugins.json

      - name: Deploy to builds branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create orphan builds branch
          git checkout --orphan builds
          git rm -rf .
          
          # Copy build artifacts
          cp Crunchymirror/build/outputs/*.cs3 .
          cp plugins.json .
          
          # Create README for builds branch
          cat > README.md << 'EOF'
          # Crunchymirror Builds
          
          This branch contains the compiled CloudStream extension artifacts.
          
          ## Repository URL for CloudStream
          ```
          https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json
          ```
          
          Add this URL in CloudStream > Settings > Extensions > Repositories
          EOF
          
          git add .
          git commit -m "Build ${{ github.sha }} - ${{ github.run_number }}"
          git push -f origin builds